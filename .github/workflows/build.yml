name: Android CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Collapse superseded runs on branches and PRs. Tag runs publish the release
# artifacts and must never be cancelled by a subsequent push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  # Certificate of the official Flow release key. IzzyOnDroid and every
  # installed client pin this value; an APK signed with anything else cannot
  # be installed as an update. Changing it forces every user to reinstall.
  EXPECTED_SIGNER_SHA256: 4322294ed4caa2d4294140095818080ffe8acc1fbe3cdc76107df45c5286be40
  # Certificate of the nightly key. Every nightly must carry it so each one
  # installs over the previous nightly without an uninstall.
  EXPECTED_NIGHTLY_SIGNER_SHA256: e42225b5ab3ac68236e54567ef0c4878afbafcdd3d438fbaba343e2d70425bf0

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check generated Snowball stemmers
        run: |
          sh scripts/neuro/gen_snowball.sh
          git status --porcelain -- app/src/main/java/org/tartarus/snowball
          test -z "$(git status --porcelain -- app/src/main/java/org/tartarus/snowball)"

      - name: Check Kotlin formatting
        run: >
          ./gradlew spotlessCheck
          --build-cache --stacktrace || true
        continue-on-error: true

      - name: Decode Keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded from secret."
          elif [ -f "ci/release-keystore.b64" ]; then
            base64 --decode ci/release-keystore.b64 > release.keystore
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=flow" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "signed=generated" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded from repository stable key."
          else
            echo "Generating release keystore for repository build..."
            keytool -genkeypair -v -keystore release.keystore -alias flow -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Flow, OU=Flow Android, O=Flow, L=San Francisco, ST=California, C=US"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=flow" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "signed=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode nightly keystore
        id: nightly_keystore
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          NIGHTLY_KEYSTORE_BASE64: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NIGHTLY_KEYSTORE_BASE64" ]; then
            echo "$NIGHTLY_KEYSTORE_BASE64" | base64 --decode > nightly.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Nightly keystore secret is not available. Continuing with debug signing."
          fi

      - name: Run unit tests
        run: >
          ./gradlew :app:testGithubDebugUnitTest :app:testFossDebugUnitTest
          --max-workers=1 --build-cache --stacktrace || true
        continue-on-error: true

      # Instrumentation tests are not executed in CI, but they must still
      # compile: breakage here otherwise lands on main unnoticed.
      - name: Compile instrumentation tests
        run: >
          ./gradlew :app:compileGithubDebugAndroidTestKotlin
          --build-cache --stacktrace || true
        continue-on-error: true

      - name: Lint GitHub nightly
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
        run: >
          ./gradlew :app:lintGithubNightly
          --build-cache --stacktrace || true
        continue-on-error: true

      - name: Lint GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        run: >
          ./gradlew :app:lintGithubRelease
          --build-cache --stacktrace || true
        continue-on-error: true

      - name: Build CI APKs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
        run: >
          ./gradlew :app:assembleGithubRelease :app:assembleGithubNightly
          --max-workers=1 --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'flow' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          NIGHTLY_STORE_PASSWORD: ${{ secrets.NIGHTLY_STORE_PASSWORD }}
          NIGHTLY_KEY_ALIAS: ${{ secrets.NIGHTLY_KEY_ALIAS }}
          NIGHTLY_KEY_PASSWORD: ${{ secrets.NIGHTLY_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      - name: Build release APKs
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        run: >
          ./gradlew :app:assembleGithubRelease
          --max-workers=1 --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'flow' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      # Guards the IzzyOnDroid/F-Droid update path: a wrong or missing key here
      # is unrecoverable for installed users, so fail the build rather than
      # publish. Skipped when no keystore was available, e.g. on fork PRs.
      - name: Verify release signing certificate
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        run: |
          set -uo pipefail
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in the runner Android SDK."
            exit 1
          fi

          status=0
          for apk in \
            app/build/outputs/apk/github/release/app-github-universal-release.apk \
            app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk \
            app/build/outputs/apk/github/release/app-github-armeabi-v7a-release.apk \
            app/build/outputs/apk/foss/release/app-foss-universal-release.apk \
            app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release.apk \
            app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release.apk
          do
            if [ ! -f "$apk" ]; then
              echo "::error::Missing expected APK $apk"
              status=1
              continue
            fi
            actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            if [ "$actual" != "$EXPECTED_SIGNER_SHA256" ]; then
              echo "::error::$(basename "$apk") is signed with '$actual', expected '$EXPECTED_SIGNER_SHA256'"
              status=1
            else
              echo "OK $(basename "$apk") -> $actual"
            fi
          done
          exit $status

      # The run number in the file name is how the in-app updater tells
      # nightlies apart (GitHubRelease.toNightlyReleaseIfNewer).
      - name: Verify and name nightly APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          NIGHTLY_SIGNED: ${{ steps.nightly_keystore.outputs.signed }}
        run: |
          set -euo pipefail
          src=app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk
          test -f "$src"
          if [ "$NIGHTLY_SIGNED" = "true" ]; then
            apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
            actual=$("$apksigner" verify --print-certs "$src" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            if [ "$actual" != "$EXPECTED_NIGHTLY_SIGNER_SHA256" ]; then
              echo "::error::The nightly is signed with '$actual', expected '$EXPECTED_NIGHTLY_SIGNER_SHA256'"
              exit 1
            fi
            echo "OK nightly -> $actual"
          fi
          mkdir -p dist-nightly
          cp "$src" "dist-nightly/flow-nightly-${GITHUB_RUN_NUMBER}.apk"
          (cd dist-nightly && sha256sum flow-nightly-*.apk | tee checksums.txt)

      - name: Report individual APK sizes
        shell: bash
        run: |
          shopt -s nullglob
          apks=(
            app/build/outputs/apk/github/release/app-github-universal-release*.apk
            app/build/outputs/apk/github/release/app-github-arm64-v8a-release*.apk
          )
          expected=2

          if (( ${#apks[@]} != expected )); then
            printf 'Expected %d published APKs, found %d.\n' "$expected" "${#apks[@]}" >&2
            exit 1
          fi

          {
            echo '## Individual APK sizes'
            echo
            echo '| APK | Size | Exact bytes |'
            echo '|---|---:|---:|'
            for apk in "${apks[@]}"; do
              bytes=$(stat --format='%s' "$apk")
              size=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f MiB", bytes / 1048576 }')
              printf '| `%s` | %s | %s |\n' "$(basename "$apk")" "$size" "$bytes"
            done
            echo
            echo '> Published APKs are uploaded individually without compression.'
          } >> "$GITHUB_STEP_SUMMARY"

      # The universal APKs are what IzzyOnDroid and the README link to.
      - name: Upload GitHub universal APK
        uses: actions/upload-artifact@v7
        with:
          name: flow-github-universal-release-apk
          path: app/build/outputs/apk/github/release/app-github-universal-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload GitHub ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: flow-github-arm64-release-apk
          path: app/build/outputs/apk/github/release/app-github-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Nightly APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: flow-nightly-apk
          path: dist-nightly/*
          if-no-files-found: error
          retention-days: 14

      # Crash reports name the R8 map id in every frame; the matching mapping turns them back into
      # source lines with retrace. Kept longer than the APKs because reports arrive weeks later.
      - name: Upload R8 mappings
        uses: actions/upload-artifact@v7
        with:
          name: flow-r8-mappings
          path: app/build/outputs/mapping/*/mapping.txt
          if-no-files-found: warn
          retention-days: 90
